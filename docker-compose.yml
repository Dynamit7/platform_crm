# SmartEdu CRM — Docker Production
# Usage:
#   docker compose up --build -d                   # SQLite (dev)
#   docker compose --profile prod up --build -d    # PostgreSQL (prod)

services:
  # ── PostgreSQL (production only) ──────────────────────────
  db:
    image: postgres:16-alpine
    container_name: smartedu_db
    restart: unless-stopped
    profiles: ["prod"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: education_crm
      POSTGRES_USER: smartedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartedu_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartedu -d education_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web (FastAPI + React SPA) ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: smartedu_web
    restart: unless-stopped
    volumes:
      - ./education_center.db:/app/education_center.db
      - ./web/frontend/uploads:/app/web/frontend/uploads
    env_file:
      - web/.env
    environment:
      DATABASE_URL: ${WEB_DB_URL:-sqlite:////app/education_center.db}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/admin/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Telegram Bot ──────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: smartedu_bot
    restart: unless-stopped
    volumes:
      - ./education_center.db:/app/education_center.db
      - ./bot.log:/app/bot.log
    env_file:
      - .env
    environment:
      API_URL: http://web:8000/api/bot
      DATABASE_URL: ${BOT_DB_URL:-sqlite+aiosqlite:////app/education_center.db}
    depends_on:
      web:
        condition: service_healthy

  # ── Nginx (reverse proxy + SSL) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: smartedu_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - bot
    restart: unless-stopped

volumes:
  pgdata:
