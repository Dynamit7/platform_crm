<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #041E42;
            --accent: #D4AF37;
            --bg: #FDF9F1;
            --surface: #fff;
            --text: #1A1A1A;
            --muted: #666;
            --border: #EAE3D5;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .bg-blobs {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }
        .blob-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
        .blob-2 { width: 350px; height: 350px; background: var(--primary); bottom: -80px; right: -80px; }

        .auth-container {
            background: var(--surface);
            border-radius: 28px;
            padding: 50px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.5s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
        }
        .auth-logo span { color: var(--accent); }
        .auth-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-sub {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 36px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
            background: var(--bg);
            color: var(--text);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(4, 30, 66, 0.06);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: 0.3s;
            margin-top: 8px;
        }
        .btn-submit:hover { background: #0A3266; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(4,30,66,0.2); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted);
        }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .error-msg {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 24px 0;
            color: var(--muted);
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            padding: 12px 8px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }
        .role-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        .role-btn span { display: block; font-size: 22px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container">
        <div class="auth-logo">TIL <span>USER</span></div>
        <h1 class="auth-title">Добро пожаловать!</h1>
        <p class="auth-sub">Войдите в свой личный кабинет</p>

        <div id="errorMsg" class="error-msg">⚠️ <span id="errorText"></span></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="loginBtn">Войти в кабинет</button>
        </form>

        <div class="auth-footer">
            Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            <br><br>
            <a href="index.html" style="color: var(--muted);">← На главную</a>
        </div>
    </div>

    <script>
        // If already logged in — redirect
        const token = localStorage.getItem('access_token');
        if (token) {
            const role = localStorage.getItem('user_role');
            if (role === 'admin') window.location.href = 'admin/dashboard.html';
            else if (role === 'teacher') window.location.href = 'teacher/dashboard.html';
            else window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errMsg = document.getElementById('errorMsg');
            const errText = document.getElementById('errorText');

            btn.textContent = 'Входим...';
            btn.disabled = true;
            errMsg.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('user_id', data.user.id);
                    localStorage.setItem('user_name', data.user.name);
                    localStorage.setItem('user_role', data.user.role);
                    localStorage.setItem('user_email', data.user.email);

                    // Redirect based on role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (data.user.role === 'teacher') {
                        window.location.href = 'teacher/dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    errText.textContent = data.detail || 'Ошибка входа';
                    errMsg.style.display = 'block';
                }
            } catch (err) {
                errText.textContent = 'Нет соединения с сервером';
                errMsg.style.display = 'block';
            } finally {
                btn.textContent = 'Войти в кабинет';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
