<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
        .settings-container {
            background: var(--card-bg, white);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 40px;
            max-width: 800px;
            margin-top: 30px;
        }
        .settings-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }
        .settings-section:last-child { border-bottom: none; }
        .settings-section h2 { font-size: 20px; margin-bottom: 20px; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .form-group input {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            background: var(--bg-color, #fff);
            color: var(--text);
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        .profile-upload {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .profile-upload .avatar-lg {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            transition: 0.3s;
            cursor: pointer;
        }
        .profile-upload .avatar-lg:hover { opacity: 0.85; transform: scale(1.04); }
        .avatar-upload-label {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .avatar-upload-label input[type="file"] { display: none; }
        .upload-hint { font-size: 12px; color: var(--text-muted, #6B7280); }
        .save-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10B981;
            color: white;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 8px 24px rgba(16,185,129,0.3);
            display: none;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
        }
        @keyframes slideInRight {
            from { transform: translateX(60px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="dynamicSidebar">
            <!-- Dynamically populated by JS -->
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <h1>Настройки профиля ⚙️</h1>
                    <p>Управляй своим аккаунтом и предпочтениями.</p>
                </div>
            </header>

            <div class="settings-container">
                <div class="settings-section">
                    <h2>Личная информация</h2>
                    <div class="profile-upload">
                        <img src="https://ui-avatars.com/api/?name=User&background=3B82F6&color=fff&size=150" id="avatarPreview" alt="Avatar" class="avatar-lg" onclick="document.getElementById('avatarInput').click()" title="Нажмите чтобы изменить">
                        <div class="avatar-upload-label">
                            <label for="avatarInput" class="btn btn-outline-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
                                📷 Изменить фото
                                <input type="file" id="avatarInput" accept="image/*">
                            </label>
                            <span class="upload-hint">JPG, PNG, WEBP · Макс. 2MB</span>
                            <span id="avatarStatus" style="font-size:12px;color:#10B981;display:none;"></span>
                        </div>
                    </div>
                    <form id="profileForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Полное имя</label>
                                <input type="text" id="profileName" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="profileEmail" required>
                            </div>
                            <div class="form-group">
                                <label>Телефон</label>
                                <input type="tel" id="profilePhone">
                            </div>
                            <div class="form-group">
                                <label>🤖 Telegram ID</label>
                                <input type="text" id="profileTelegram" disabled style="background:var(--bg-color,#F8FAFC);color:var(--text-muted);">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="margin-top: 25px;">Сохранить изменения</button>
                    </form>
                </div>

                <div class="settings-section">
                    <h2>Безопасность</h2>
                    <form id="passwordForm">
                        <div class="form-group" style="max-width: 300px;">
                            <label>Новый пароль</label>
                            <input type="password" id="newPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-outline-sm" style="margin-top: 15px;">Обновить пароль</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

<div class="save-toast" id="saveToast">✅ Сохранено!</div>
<script src="auth-utils.js"></script>
<script>
    const role = localStorage.getItem('user_role');
    const token = localStorage.getItem('access_token');
    
    if (!token) {
        window.location.href = 'login.html';
    }

    const sidebar = document.getElementById('dynamicSidebar');
    let sidebarHtml = '';
    
    if (role === 'admin') {
        sidebarHtml = `
            <div class="sidebar-logo">
                <img src="logo.png" alt="TIL USER Logo" style="height:32px; width:auto; border-radius:4px;">
                TIL <span>USER</span><small>ADMIN</small>
            </div>
            <nav class="sidebar-nav">
                <div class="section-label">Главное</div>
                <a href="admin/dashboard.html"><span class="icon">📊</span> Дашборд</a>
                <a href="admin/leads.html"><span class="icon">🎯</span> Заявки (Kanban)</a>

                <div class="section-label">Управление</div>
                <a href="admin/students.html"><span class="icon">👨‍🎓</span> Студенты</a>
                <a href="admin/teachers.html"><span class="icon">👩‍🏫</span> Преподаватели</a>
                <a href="admin/groups.html"><span class="icon">👥</span> Группы</a>
                <a href="admin/courses.html"><span class="icon">📚</span> Курсы</a>

                <div class="section-label">Финансы</div>
                <a href="admin/payments.html"><span class="icon">💳</span> Платежи</a>
                <a href="admin/reports.html"><span class="icon">📈</span> Отчёты</a>
            </nav>
            <div class="sidebar-bottom">
                <a href="settings.html" class="active"><span class="icon">⚙️</span> Настройки</a>
                <a href="login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
            </div>
        `;
    } else if (role === 'teacher') {
        sidebarHtml = `
            <div class="sidebar-logo">
                <img src="logo.png" alt="TIL USER Logo" style="height:32px; width:auto; border-radius:4px;">
                TIL <span>USER</span><small>TEACHER</small>
            </div>
            <nav class="sidebar-nav">
                <a href="teacher/dashboard.html"><span class="icon">📊</span> Мой кабинет</a>
                <a href="teacher/students.html"><span class="icon">👨‍🎓</span> Мои студенты</a>
                <a href="teacher/homeworks.html"><span class="icon">📝</span> Проверка ДЗ</a>
                <a href="teacher/lessons.html"><span class="icon">🗓️</span> Уроки</a>
            </nav>
            <div class="sidebar-bottom">
                <a href="settings.html" class="active"><span class="icon">⚙️</span> Настройки</a>
                <a href="login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
            </div>
        `;
    } else {
        sidebarHtml = `
            <div class="sidebar-logo">TIL <span>USER</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Дашборд</a>
                <a href="courses.html"><span class="icon">📚</span> Мои курсы</a>
                <a href="schedule.html"><span class="icon">🗓️</span> Расписание</a>
                <a href="homeworks.html"><span class="icon">📝</span> Домашние задания</a>
                <a href="achievements.html"><span class="icon">🏆</span> Достижения</a>
            </nav>
            <div class="sidebar-bottom">
                <a href="settings.html" class="active"><span class="icon">⚙️</span> Настройки</a>
                <a href="login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
            </div>
        `;
    }
    
    sidebar.innerHTML = sidebarHtml;

    document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        logout();
    });

    async function loadProfile() {
        try {
            const res = await fetch('/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const user = await res.json();
                document.getElementById('profileName').value = user.name || '';
                document.getElementById('profileEmail').value = user.email || '';
                document.getElementById('profilePhone').value = user.phone || '';
                if (document.getElementById('profileTelegram')) {
                    document.getElementById('profileTelegram').value = user.telegram_id ? `@TG: ${user.telegram_id}` : 'Не привязан';
                }
                // Load avatar
                const storedAvatar = localStorage.getItem('user_avatar');
                const avatarEl = document.getElementById('avatarPreview');
                if (avatarEl) {
                    if (user.avatar_url) {
                        avatarEl.src = user.avatar_url;
                        localStorage.setItem('user_avatar', user.avatar_url);
                    } else if (storedAvatar) {
                        avatarEl.src = storedAvatar;
                    } else {
                        // Generate initials avatar
                        const initials = encodeURIComponent(user.name || 'User');
                        avatarEl.src = `https://ui-avatars.com/api/?name=${initials}&background=3B82F6&color=fff&size=150`;
                    }
                }
            }
        } catch (e) {
            console.error(e);
        }
    }

    // Avatar upload handler
    const avatarInput = document.getElementById('avatarInput');
    if (avatarInput) {
        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                alert('Файл слишком большой. Максимум 2MB.');
                return;
            }
            const statusEl = document.getElementById('avatarStatus');
            if (statusEl) { statusEl.textContent = 'Загрузка...'; statusEl.style.display = 'block'; }

            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result; // data:image/...;base64,...
                // Show preview immediately
                document.getElementById('avatarPreview').src = base64;
                localStorage.setItem('user_avatar', base64);

                // Save via API
                try {
                    const res = await fetch('/auth/me', {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ avatar_url: base64 })
                    });
                    if (res.ok) {
                        if (statusEl) statusEl.textContent = '✅ Фото сохранено!';
                        showToast('Фото профиля обновлено!');
                    } else {
                        if (statusEl) statusEl.textContent = 'Ошибка сохранения';
                    }
                } catch(e) {
                    if (statusEl) statusEl.textContent = 'Ошибка сети';
                }
            };
            reader.readAsDataURL(file);
        });
    }

    function showToast(msg) {
        const t = document.getElementById('saveToast');
        if (!t) return;
        t.textContent = `✅ ${msg}`;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }
    
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('profileName').value,
            email: document.getElementById('profileEmail').value,
            phone: document.getElementById('profilePhone').value
        };
        try {
            const res = await fetch('/auth/me', {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user_name', user.name);
                localStorage.setItem('user_email', user.email || '');
                showToast('Профиль обновлен + синхронизирован!');
            } else {
                alert('Ошибка при обновлении профиля');
            }
        } catch(e) {
            alert('Ошибка сети');
        }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('newPassword').value;
        if (!pw) return;
        try {
            const res = await fetch('/auth/me', {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: pw })
            });
            if (res.ok) {
                alert('Пароль успешно обновлен!');
                document.getElementById('newPassword').value = '';
            } else {
                alert('Ошибка при обновлении пароля');
            }
        } catch(e) {
            alert('Ошибка сети');
        }
    });

    loadProfile();
</script>
</body>
</html>
