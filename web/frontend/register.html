<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #041E42; --accent: #D4AF37; --bg: #FDF9F1;
            --surface: #fff; --text: #1A1A1A; --muted: #666;
            --border: #EAE3D5; --danger: #ef4444; --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.12; pointer-events: none; }
        .blob-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; right: -100px; }
        .blob-2 { width: 350px; height: 350px; background: var(--primary); bottom: -80px; left: -80px; }

        .auth-container {
            background: var(--surface);
            border-radius: 28px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.5s ease-out;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .auth-logo { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; color: var(--primary); text-align: center; margin-bottom: 10px; }
        .auth-logo span { color: var(--accent); }
        .auth-title { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 8px; }
        .auth-sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 36px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 14px 18px; border: 1.5px solid var(--border);
            border-radius: 14px; font-size: 15px; font-family: inherit;
            transition: 0.3s; background: var(--bg); color: var(--text);
        }
        .form-group input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(4, 30, 66, 0.06); }
        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; font-family: 'Outfit', sans-serif; transition: 0.3s; margin-top: 8px;
        }
        .btn-submit:hover { background: #0A3266; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(4,30,66,0.2); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .error-msg { background: rgba(239,68,68,0.08); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 20px; display: none; }
        .success-msg { background: rgba(16,185,129,0.08); color: var(--success); border: 1px solid rgba(16,185,129,0.2); border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="auth-container">
        <div class="auth-logo">TIL <span>USER</span></div>
        <h1 class="auth-title">Создать аккаунт</h1>
        <p class="auth-sub">Начни свой путь к свободному общению</p>

        <div id="errorMsg" class="error-msg">⚠️ <span id="errorText"></span></div>
        <div id="successMsg" class="success-msg">✅ Аккаунт создан! Перенаправляем...</div>

        <form id="registerForm">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" id="name" placeholder="Например, Самат" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" id="phone" placeholder="+7 (700) 000-00-00">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            <button type="submit" class="btn-submit" id="regBtn">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="login.html">Войти</a>
            <br><br>
            <a href="index.html" style="color: var(--muted);">← На главную</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const errMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            btn.textContent = 'Создаём аккаунт...';
            btn.disabled = true;
            errMsg.style.display = 'none';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value || null,
                password: document.getElementById('password').value,
                role: 'student'
            };

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('user_id', data.user.id);
                    localStorage.setItem('user_name', data.user.name);
                    localStorage.setItem('user_role', data.user.role);
                    successMsg.style.display = 'block';
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    document.getElementById('errorText').textContent = data.detail || 'Ошибка регистрации';
                    errMsg.style.display = 'block';
                }
            } catch (err) {
                document.getElementById('errorText').textContent = 'Нет соединения с сервером';
                errMsg.style.display = 'block';
            } finally {
                btn.textContent = 'Зарегистрироваться';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
