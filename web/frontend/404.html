<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #041E42;
            --accent: #F59E0B;
            --bg: #F8FAFC;
            --text: #1E293B;
            --muted: #94A3B8;
        }
        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            animation: float 8s ease-in-out infinite;
        }
        .blob-1 { width: 500px; height: 500px; background: #3B82F6; top: -100px; left: -100px; animation-delay: 0s; }
        .blob-2 { width: 400px; height: 400px; background: #F59E0B; bottom: -80px; right: -80px; animation-delay: 3s; }
        .blob-3 { width: 300px; height: 300px; background: #8B5CF6; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 1.5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        .blob-3 { animation-name: float2; }
        @keyframes float2 {
            0%, 100% { transform: translate(-50%,-50%) scale(1); }
            50% { transform: translate(-50%,-55%) scale(1.08); }
        }

        /* Card */
        .card {
            position: relative;
            z-index: 1;
            background: white;
            border-radius: 32px;
            padding: 60px 80px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(4,30,66,0.12);
            max-width: 560px;
            width: 90%;
            animation: slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -4px;
        }
        .emoji { font-size: 64px; margin-bottom: 20px; display: block; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
        p { font-size: 15px; color: var(--muted); margin-bottom: 36px; line-height: 1.6; }

        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #1a3a6e);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(4,30,66,0.3); }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid rgba(4,30,66,0.15);
        }
        .btn-outline:hover { background: rgba(4,30,66,0.05); transform: translateY(-2px); }

        .logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 32px;
            display: block;
        }
        .logo span { color: var(--accent); }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="card">
        <span class="logo">TIL <span>USER</span></span>
        <div class="error-code">404</div>
        <span class="emoji">🔍</span>
        <h1>Страница не найдена</h1>
        <p>Кажется, этой страницы не существует или она была перемещена.<br>Вернитесь на главную или воспользуйтесь навигацией.</p>

        <div class="btn-group">
            <a href="javascript:history.back()" class="btn btn-outline">← Назад</a>
            <a id="homeBtn" href="index.html" class="btn btn-primary">🏠 На главную</a>
        </div>
    </div>

<script>
    // Smart redirect based on user role
    const token = localStorage.getItem('access_token');
    const role = localStorage.getItem('user_role');
    const homeBtn = document.getElementById('homeBtn');

    if (token && role) {
        if (role === 'admin') {
            homeBtn.href = 'admin/dashboard.html';
            homeBtn.textContent = '🏠 В панель админа';
        } else if (role === 'teacher') {
            homeBtn.href = 'teacher/dashboard.html';
            homeBtn.textContent = '🏠 В кабинет учителя';
        } else if (role === 'student') {
            homeBtn.href = 'dashboard.html';
            homeBtn.textContent = '🏠 В мой кабинет';
        }
    }
</script>
</body>
</html>
