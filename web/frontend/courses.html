<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои курсы | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .course-card-full {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .course-card-full:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(4,30,66,0.08);
        }
        .course-image {
            height: 180px;
            background: var(--primary);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        .course-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
        }
        .course-content {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .course-content h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .course-content p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            flex: 1;
        }
        .course-progress-wrap { margin-bottom: 20px; }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .progress-track {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-track-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--accent);
            transition: width 0.6s ease;
        }
        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
            gap: 10px;
        }
        .meta-item { display: flex; align-items: center; gap: 6px; }
        .meta-item strong { color: var(--primary); }
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state p { font-size: 18px; margin-top: 15px; }
    </style>
</head>
<body>
<script src="auth-utils.js"></script>
<script>var _r=localStorage.getItem('user_role');if(_r==='admin')window.location.href='admin/dashboard.html';else if(_r==='teacher')window.location.href='teacher/dashboard.html';</script>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">TIL <span>USER</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Дашборд</a>
                <a href="courses.html" class="active"><span class="icon">📚</span> Мои курсы</a>
                <a href="schedule.html"><span class="icon">🗓️</span> Расписание</a>
                <a href="homeworks.html"><span class="icon">📝</span> Домашние задания</a>
                <a href="achievements.html"><span class="icon">🏆</span> Достижения</a>
            </nav>
            <div class="sidebar-bottom">
                <a href="settings.html"><span class="icon">⚙️</span> Настройки</a>
                <a href="#" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <h1>Мои курсы 📚</h1>
                    <p>Все программы, которые ты изучаешь.</p>
                </div>
            </header>
            <div class="courses-grid" id="coursesGrid">
                <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);">Загрузка...</div>
            </div>
        </main>
    </div>

    <script>
        const API = '';
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = 'login.html';

        const userId = localStorage.getItem('user_id');
        document.getElementById('logoutBtn').onclick = (e) => {
            e.preventDefault();
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        };

        const IMGS = {
            japonskiy: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=500&q=80',
            korejskiy: 'https://images.unsplash.com/photo-1538669715315-155098f0fb1d?auto=format&fit=crop&w=500&q=80',
            russkiy: 'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=500&q=80',
        };
        const FLAGS = { 'японский': '🇯🇵', 'корейский': '🇰🇷', 'русский': '🇷🇺', 'английский': '🇬🇧' };
        const COLORS = ['#D4AF37', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6'];

        function getFlag(title = '') {
            const t = title.toLowerCase();
            for (const [k, f] of Object.entries(FLAGS)) if (t.includes(k)) return f;
            return '📚';
        }

        async function loadCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);">Загрузка...</div>';
            try {
                const res = await fetch(`${API}/api/dashboard/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('auth');
                const data = await res.json();
                const enrollments = data.enrollments || [];

                if (!enrollments.length) {
                    grid.innerHTML = `<div class="empty-state"><div style="font-size:60px;">📭</div><p>Вы ещё не записаны ни на один курс.<br>Обратитесь к администратору.</p></div>`;
                    return;
                }

                grid.innerHTML = enrollments.map((e, i) => {
                    const c = e.course || {};
                    const flag = getFlag(c.title);
                    const color = COLORS[i % COLORS.length];
                    const progressPct = e.progress || 0;
                    return `
                        <div class="course-card-full">
                            <div class="course-image" style="background: linear-gradient(135deg, var(--primary), #1F4A7C);">
                                <span>${flag}</span>
                                <div class="course-badge">${Math.round(progressPct)}% пройдено</div>
                            </div>
                            <div class="course-content">
                                <h3>${c.title || 'Курс'}</h3>
                                <p>${c.description || 'Интенсивный курс с полным погружением в языковую среду.'}</p>
                                <div class="course-progress-wrap">
                                    <div class="progress-info">
                                        <span>Прогресс</span><span>${progressPct}%</span>
                                    </div>
                                    <div class="progress-track">
                                        <div class="progress-track-fill" style="width:${progressPct}%;background:${color};"></div>
                                    </div>
                                </div>
                                <div class="course-meta">
                                    <div class="meta-item">⌛ <strong>${c.duration || '—'}</strong></div>
                                    <div class="meta-item">⚡ <strong>${e.xp || 0} XP</strong></div>
                                    <div class="meta-item">💰 <strong>${c.price ? c.price.toLocaleString() + ' UZS' : '—'}</strong></div>
                                </div>
                                <button class="btn-primary w-100" style="margin-top:20px;" onclick="window.location.href='schedule.html'">📅 Расписание занятий</button>
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="empty-state"><div style="font-size:60px;">⚠️</div><p>Не удалось загрузить курсы.<br>Проверьте соединение с сервером.</p></div>`;
            }
        }

        loadCourses();
    </script>

</body>
</html>
