<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои группы | TIL USER Teacher</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
    <style>
        .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .group-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            transition: 0.25s;
            position: relative;
            overflow: hidden;
        }
        .group-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3B82F6, #6366F1);
        }
        .group-card:hover { box-shadow: 0 8px 32px rgba(59,130,246,0.15); transform: translateY(-3px); }
        .group-card.inactive::before { background: var(--border); }
        .group-card.inactive { opacity: 0.7; }

        .group-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .group-name { font-size: 18px; font-weight: 800; font-family: 'Outfit', sans-serif; color: var(--text); }
        .group-course { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .group-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .badge-active { background: #ECFDF5; color: #065F46; }
        .badge-inactive { background: #F3F4F6; color: #6B7280; }

        .group-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
        .g-stat { text-align: center; background: var(--bg-color); border-radius: 12px; padding: 10px 6px; }
        .g-stat-val { font-size: 22px; font-weight: 800; font-family: 'Outfit', sans-serif; color: #3B82F6; }
        .g-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

        .schedule-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .schedule-chip {
            display: flex; align-items: center; gap: 5px;
            background: #EFF6FF; color: #1D4ED8;
            font-size: 12px; font-weight: 600;
            padding: 5px 10px; border-radius: 8px;
        }

        .action-row { display: flex; gap: 8px; margin-top: 16px; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border-radius: 24px; width: 680px; max-width: 95vw; max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(0,0,0,0.25); animation: slideUp 0.25s ease; }
        @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-head { padding: 24px 28px 0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
        .modal-body { padding: 20px 28px 28px; overflow-y: auto; }

        .student-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .student-row:last-child { border-bottom: none; }
        .s-av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#3B82F6,#6366F1); color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .s-details { flex: 1; }
        .s-nm { font-weight: 700; font-size: 14px; }
        .s-em { font-size: 12px; color: var(--muted); }
        .progress-mini { height: 5px; background: #EFF6FF; border-radius: 99px; overflow: hidden; margin-top: 6px; }
        .progress-mini-fill { height: 100%; background: linear-gradient(90deg, #3B82F6, #6366F1); border-radius: 99px; }

        .empty-box { text-align: center; padding: 40px; color: var(--muted); }
        .empty-box .emoji { font-size: 48px; margin-bottom: 12px; }

        .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; flex-shrink: 0; padding: 0 28px; }
        .tab-btn { padding: 10px 18px; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.2s; }
        .tab-btn.active { color: #3B82F6; border-bottom-color: #3B82F6; font-weight: 700; }

        .schedule-table { width: 100%; border-collapse: collapse; }
        .schedule-table th { background: var(--bg-color); font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px; text-align: left; }
        .schedule-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .schedule-table tr:last-child td { border-bottom: none; }

        .kpi-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; }
        .kpi-val { font-size: 32px; font-weight: 800; font-family: 'Outfit', sans-serif; color: #3B82F6; }
        .kpi-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
    </style>
</head>
<body>

<aside id="main-sidebar" class="sidebar">
    <div class="sidebar-logo"><img src="../logo.png" alt="Logo" style="height:32px;"> TIL <span>USER</span><small>TEACHER</small></div>
    <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span> Мой кабинет</a>
        <a href="students.html"><span class="icon">👨‍🎓</span> Мои студенты</a>
        <a href="groups.html" class="active"><span class="icon">👥</span> Мои группы</a>
        <a href="gradebook.html"><span class="icon">📋</span> Журнал</a>
        <a href="homeworks.html"><span class="icon">📝</span> Проверка ДЗ</a>
        <a href="lessons.html"><span class="icon">🗓️</span> Уроки</a>
        <a href="attendance.html"><span class="icon">✅</span> Посещаемость</a>
        <a href="../chat.html"><span class="icon">💬</span> Чат <span class="chat-badge"></span></a>
    </nav>
    <div class="sidebar-bottom">
    <button class="notif-bell" onclick="toggleNotifDropdown()" title="Уведомления">🔔 <span class="badge-dot"></span></button>
    <div class="notif-dropdown" id="notifDropdown"></div>



    <a href="../index.html"><span class="icon">🌐</span> На сайт</a>
    <a href="../settings.html"><span class="icon">⚙️</span> Настройки</a>
    <a href="../login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
</div>
</aside>



<div class="page-content"><!-- KPI Top -->
        <div class="kpi-top">
            <div class="kpi-card">
                <div class="kpi-val" id="kpiGroups">—</div>
                <div class="kpi-lbl">Групп</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-val" id="kpiStudents">—</div>
                <div class="kpi-lbl">Студентов</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-val" id="kpiLessons">—</div>
                <div class="kpi-lbl">Уроков этой недели</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-bar" style="margin-bottom:20px;">
            <input type="text" id="searchGroup" class="search-input" placeholder="🔍 Поиск группы...">
            <select id="filterStatus" class="filter-select">
                <option value="">Все статусы</option>
                <option value="active">Активные</option>
                <option value="inactive">Неактивные</option>
            </select>
        </div>

        <!-- Groups Grid -->
        <div class="group-grid" id="groupGrid">
            <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);">
                <div style="font-size:32px;margin-bottom:12px;">⏳</div>
                Загрузка групп...
            </div>
        </div>
    </div>
</div>

<!-- Group Detail Modal -->
<div class="modal-overlay" id="groupModal">
    <div class="modal">
        <div class="modal-head">
            <div>
                <h2 id="modalGroupName" style="margin:0;font-family:'Outfit',sans-serif;">Группа</h2>
                <div id="modalGroupCourse" style="font-size:13px;color:var(--muted);margin-top:4px;"></div>
            </div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="tabs" id="modalTabs">
            <button class="tab-btn active" onclick="switchTab(this,'tabStudents')">👨‍🎓 Студенты</button>
            <button class="tab-btn" onclick="switchTab(this,'tabSchedule')">🗓️ Расписание</button>
            <button class="tab-btn" onclick="switchTab(this,'tabLessons')">📋 Уроки</button>
        </div>
        <div class="modal-body">
            <!-- Students Tab -->
            <div id="tabStudents" class="tab-panel-m active"></div>
            <!-- Schedule Tab -->
            <div id="tabSchedule" class="tab-panel-m" style="display:none;"></div>
            <!-- Lessons Tab -->
            <div id="tabLessons" class="tab-panel-m" style="display:none;"></div>
        </div>
    </div>
</div>

<script src="../auth-utils.js"></script>
<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    const myId = parseInt(localStorage.getItem('user_id'));
    const role = localStorage.getItem('user_role');
    if (!token || (role !== 'teacher' && role !== 'admin')) window.location.href = '../login.html';
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../login.html'; };
    function authH() { return { 'Authorization': `Bearer ${token}` }; }

    let allGroups = [], allEnrollments = {}, currentGroupId = null;

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    const DAY_NAMES = { Mon:'Пн', Tue:'Вт', Wed:'Ср', Thu:'Чт', Fri:'Пт', Sat:'Сб', Sun:'Вс',
        'Пн':'Пн','Вт':'Вт','Ср':'Ср','Чт':'Чт','Пт':'Пт','Сб':'Сб','Вс':'Вс' };

    function getScheduleChips(scheduleJson) {
        if (!scheduleJson || !scheduleJson.length) return '<span style="font-size:12px;color:var(--muted);">Расписание не задано</span>';
        return scheduleJson.map(s => `
            <div class="schedule-chip">
                📅 ${DAY_NAMES[s.day] || s.day} <strong>${s.time || ''}</strong>
            </div>`).join('');
    }

    function renderGroups(groups) {
        const grid = document.getElementById('groupGrid');
        if (!groups.length) {
            grid.innerHTML = `<div style="grid-column:1/-1" class="empty-box"><div class="emoji">📭</div>Группы не найдены</div>`;
            return;
        }
        grid.innerHTML = groups.map(g => {
            const schedule = typeof g.schedule_json === 'string' ? JSON.parse(g.schedule_json || '[]') : (g.schedule_json || []);
            const enrolled = allEnrollments[g.id] || 0;
            const fillPct = Math.round((enrolled / (g.max_students || 1)) * 100);
            return `
            <div class="group-card ${g.is_active ? '' : 'inactive'}" onclick="openGroupModal(${g.id})">
                <div class="group-header">
                    <div>
                        <div class="group-name">${esc(g.name)}</div>
                        <div class="group-course">${g.course ? '📚 ' + esc(g.course.title) : ''}</div>
                    </div>
                    <span class="group-badge ${g.is_active ? 'badge-active' : 'badge-inactive'}">
                        ${g.is_active ? '● Активна' : '○ Неактивна'}
                    </span>
                </div>

                <div class="group-stats">
                    <div class="g-stat">
                        <div class="g-stat-val">${enrolled}</div>
                        <div class="g-stat-lbl">Студентов</div>
                    </div>
                    <div class="g-stat">
                        <div class="g-stat-val">${g.max_students}</div>
                        <div class="g-stat-lbl">Макс. мест</div>
                    </div>
                    <div class="g-stat">
                        <div class="g-stat-val">${schedule.length}</div>
                        <div class="g-stat-lbl">Занятий/нед.</div>
                    </div>
                </div>

                <!-- Fill progress -->
                <div style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;">
                        <span>Заполненность</span><span>${fillPct}%</span>
                    </div>
                    <div style="background:#EFF6FF;border-radius:99px;height:6px;overflow:hidden;">
                        <div style="width:${fillPct}%;height:100%;background:linear-gradient(90deg,#3B82F6,#6366F1);border-radius:99px;"></div>
                    </div>
                </div>

                <div class="schedule-chips">${getScheduleChips(schedule)}</div>

                <div class="action-row">
                    <a href="attendance.html?group=${g.id}" class="btn btn-outline btn-sm" style="text-decoration:none;" onclick="event.stopPropagation()">✅ Посещаемость</a>
                    <a href="lessons.html?group=${g.id}" class="btn btn-outline btn-sm" style="text-decoration:none;" onclick="event.stopPropagation()">🗓️ Уроки</a>
                </div>
            </div>`;
        }).join('');
    }

    // ── Filters ──
    document.getElementById('searchGroup').addEventListener('input', applyFilters);
    document.getElementById('filterStatus').addEventListener('change', applyFilters);
    function applyFilters() {
        const q = document.getElementById('searchGroup').value.toLowerCase();
        const st = document.getElementById('filterStatus').value;
        const filtered = allGroups.filter(g => {
            const matchQ = !q || g.name.toLowerCase().includes(q) || (g.course?.title || '').toLowerCase().includes(q);
            const matchSt = !st || (st === 'active' ? g.is_active : !g.is_active);
            return matchQ && matchSt;
        });
        renderGroups(filtered);
    }

    // ── Load data ──
    async function load() {
        showLoading('groupGrid', 'Загрузка групп...');
        try {
            const [groupRes, enrollRes] = await Promise.all([
                fetch(`${API}/api/groups`, { headers: authH() }),
                fetch(`${API}/api/admin/students`, { headers: authH() })
            ]);

            if (!groupRes.ok) {
                showError('groupGrid', 'Нет доступа', 'Нет доступа к группам');
                return;
            }

            allGroups = await groupRes.json();

            // Use enrollment count from group data if available
            allGroups.forEach(g => {
                allEnrollments[g.id] = g.enrollments_count || 0;
            });

            // Load enrollment counts individually
            const enrollPromises = allGroups.map(g =>
                fetch(`${API}/api/groups/${g.id}/attendance`, { headers: authH() })
                    .then(r => r.ok ? r.json() : null)
                    .then(data => { if (data) allEnrollments[g.id] = data.students?.length || 0; })
                    .catch(() => {})
            );
            await Promise.allSettled(enrollPromises);

            // KPIs
            const totalStudents = Object.values(allEnrollments).reduce((a,b) => a+b, 0);
            const activeGroups = allGroups.filter(g => g.is_active).length;
            const weeklyLessons = allGroups.reduce((acc, g) => {
                const sched = typeof g.schedule_json === 'string' ? JSON.parse(g.schedule_json || '[]') : (g.schedule_json || []);
                return acc + sched.length;
            }, 0);

            document.getElementById('kpiGroups').textContent = activeGroups;
            document.getElementById('kpiStudents').textContent = totalStudents;
            document.getElementById('kpiLessons').textContent = weeklyLessons;

            renderGroups(allGroups);
        } catch(e) {
            console.error(e);
            showError('groupGrid', 'Ошибка', 'Не удалось загрузить группы');
        }
    }

    // ── Modal ──
    function openModal() { document.getElementById('groupModal').classList.add('open'); }
    function closeModal() {
        document.getElementById('groupModal').classList.remove('open');
        currentGroupId = null;
    }
    document.getElementById('groupModal').addEventListener('click', e => {
        if (e.target === document.getElementById('groupModal')) closeModal();
    });

    async function openGroupModal(groupId) {
        currentGroupId = groupId;
        const group = allGroups.find(g => g.id === groupId);
        if (!group) return;

        const schedule = typeof group.schedule_json === 'string' ? JSON.parse(group.schedule_json || '[]') : (group.schedule_json || []);

        document.getElementById('modalGroupName').textContent = group.name;
        document.getElementById('modalGroupCourse').textContent = group.course ? `📚 ${group.course.title}` : '';

        // Reset tabs
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.tab-btn').classList.add('active');
        showTabContent('tabStudents');
        showLoading('tabStudents', 'Загрузка студентов...');

        openModal();

        // Load attendance (includes students)
        try {
            const res = await fetch(`${API}/api/groups/${groupId}/attendance`, { headers: authH() });
            const data = res.ok ? await res.json() : null;
            const students = data?.students || [];

            // Students tab
            if (!students.length) {
                document.getElementById('tabStudents').innerHTML = '<div class="empty-box"><div class="emoji">📭</div>В группе нет студентов</div>';
            } else {
                document.getElementById('tabStudents').innerHTML = `
                    <div style="font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600;">${students.length} студентов</div>
                    ${students.map(s => {
                        const initials = (s.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
                        const attPct = s.lessons_total > 0 ? Math.round((s.attended_count / s.lessons_total) * 100) : 0;
                        return `
                        <div class="student-row">
                            <div class="s-av">${initials}</div>
                            <div class="s-details">
                                <div class="s-nm">${esc(s.name)}</div>
                                <div class="s-em">Посещаемость: ${s.attended_count}/${s.lessons_total} уроков</div>
                                <div class="progress-mini"><div class="progress-mini-fill" style="width:${attPct}%"></div></div>
                            </div>
                            <div style="text-align:right;font-size:13px;">
                                <div style="font-weight:700;color:${attPct >= 70 ? '#10B981' : attPct >= 40 ? '#F59E0B' : '#EF4444'}">${attPct}%</div>
                                <div style="font-size:11px;color:var(--muted);">посещ.</div>
                            </div>
                        </div>`;
                    }).join('')}`;
            }

            // Schedule tab
            if (!schedule.length) {
                document.getElementById('tabSchedule').innerHTML = '<div class="empty-box"><div class="emoji">📅</div>Расписание не задано</div>';
            } else {
                document.getElementById('tabSchedule').innerHTML = `
                    <table class="schedule-table">
                        <thead><tr><th>День</th><th>Время</th><th>Продолжительность</th></tr></thead>
                        <tbody>
                            ${schedule.map(s => `
                                <tr>
                                    <td><strong>${DAY_NAMES[s.day] || s.day}</strong></td>
                                    <td>${s.time || '—'}</td>
                                    <td>${s.duration || '90 мин'}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>`;
            }

            // Lessons tab
            const lesRes = await fetch(`${API}/api/groups/${groupId}/lessons`, { headers: authH() });
            const lessons = lesRes.ok ? await lesRes.json() : [];
            if (!lessons.length) {
                document.getElementById('tabLessons').innerHTML = '<div class="empty-box"><div class="emoji">🗓️</div>Уроков не запланировано</div>';
            } else {
                document.getElementById('tabLessons').innerHTML = `
                    <div style="font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600;">${lessons.length} уроков</div>
                    ${lessons.slice(0,10).map(l => {
                        const d = l.scheduled_at ? new Date(l.scheduled_at) : null;
                        const isPast = d && d < new Date();
                        return `
                        <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);">
                            <div style="width:40px;height:40px;border-radius:12px;background:${isPast ? '#F3F4F6' : '#EFF6FF'};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">
                                ${l.is_completed ? '✅' : isPast ? '⏰' : '🗓️'}
                            </div>
                            <div style="flex:1;">
                                <div style="font-weight:700;font-size:14px;">${esc(l.topic || 'Занятие')}</div>
                                <div style="font-size:12px;color:var(--muted);">${d ? d.toLocaleString('ru-RU', {dateStyle:'medium',timeStyle:'short'}) : '—'}</div>
                            </div>
                            ${l.zoom_link ? `<a href="${esc(l.zoom_link)}" target="_blank" class="btn btn-accent btn-sm" style="text-decoration:none;flex-shrink:0;">🔗 Zoom</a>` : ''}
                        </div>`;
                    }).join('')}
                    ${lessons.length > 10 ? `<div style="text-align:center;padding:12px;font-size:13px;color:var(--muted);">Показано 10 из ${lessons.length}</div>` : ''}`;
            }

        } catch(e) {
            showError('tabStudents', 'Ошибка', 'Не удалось загрузить данные группы');
        }
    }

    function switchTab(btn, tabId) {
        document.querySelectorAll('#modalTabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showTabContent(tabId);
    }

    function showTabContent(activeId) {
        ['tabStudents','tabSchedule','tabLessons'].forEach(id => {
            document.getElementById(id).style.display = id === activeId ? 'block' : 'none';
        });
    }

    load();
</script>

<div class="sidebar-overlay" ></div>
</body>
</html>
