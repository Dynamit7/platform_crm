</head>

        <a href="groups.html"><span class="icon">👥</span> Группы</a>

        <a href="homeworks.html"><span class="icon">📝</span> Проверка ДЗ</a>
        <a href="lessons.html" class="active"><span class="icon">🗓️</span> Уроки</a>
        <a href="attendance.html"><span class="icon">✅</span> Посещаемость</a>

    <a href="../index.html"><span class="icon">🌐</span> На сайт</a>

</div>
</aside>



<div class="page-content"><!-- Group selector -->
        <div class="filters-bar" style="margin-bottom: 24px;">
            <label style="font-size:14px;font-weight:600;color:var(--muted);">Группа:</label>
            <select class="filter-select" id="groupSelect" style="min-width:240px;">
                <option value="">— Выберите группу —</option>
            </select>
            <span id="lessonsCount" style="font-size:13px;color:var(--muted);margin-left:auto;"></span>
        </div>

        <!-- Lessons list -->
        <div id="lessonsContainer" style="display:flex;flex-direction:column;gap:14px;">
            <div class="panel">
                <div class="panel-body" style="text-align:center;padding:60px;">
                    <div style="font-size:50px;margin-bottom:16px;">🗓️</div>
                    <h3 style="margin-bottom:10px;">Выберите группу</h3>
                    <p style="color:var(--muted);margin-bottom:20px;">Выберите группу выше, чтобы увидеть расписание уроков.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create Lesson Modal -->
<div id="lessonModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);z-index:999;align-items:center;justify-content:center;">
    <div style="background:var(--surface);border-radius:24px;padding:36px;width:90%;max-width:500px;box-shadow:0 25px 60px rgba(0,0,0,0.15);max-height:90vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <h2>🗓️ Новый урок</h2>
            <button onclick="closeModal()" style="font-size:24px;background:none;border:none;cursor:pointer;color:var(--muted);">×</button>
        </div>
        <form id="lessonForm">
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Группа</label>
                <select id="lGroupId" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" required>
                    <option value="">— Выберите группу —</option>
                </select>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Тема урока</label>
                <input type="text" id="lTopic" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="Кандзи N4: числа и время" required>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Описание (необязательно)</label>
                <textarea id="lDesc" style="width:100%;height:70px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;resize:vertical;" placeholder="Краткое описание темы..."></textarea>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Дата и время</label>
                <input type="datetime-local" id="lDateTime" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" required>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Zoom-ссылка (необязательно)</label>
                <input type="url" id="lZoom" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="https://zoom.us/j/...">
            </div>
            <div id="lError" style="display:none;color:var(--danger);font-size:13px;margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">Создать урок</button>
        </form>
    </div>
</div>

<script src="../auth-utils.js"></script>
<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    const role  = localStorage.getItem('user_role');
    if (!token || (role !== 'teacher' && role !== 'admin')) window.location.href = '../login.html';
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../login.html'; };
    function authHeaders() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

    let allGroups = [];

    function formatDateTime(dt) {
        if (!dt) return '—';
        const d = new Date(dt);
        return d.toLocaleString('ru-RU', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function renderLessons(lessons, groupName) {
        const container = document.getElementById('lessonsContainer');
        document.getElementById('lessonsCount').textContent = `Уроков: ${lessons.length}`;

        if (!lessons.length) {
            container.innerHTML = `
                <div class="panel">
                    <div class="panel-body" style="text-align:center;padding:50px;">
                        <div style="font-size:50px;margin-bottom:16px;">📭</div>
                        <h3 style="margin-bottom:10px;">Уроков пока нет</h3>
                        <p style="color:var(--muted);margin-bottom:20px;">В группе «${groupName}» ещё нет уроков.</p>
                        <button class="btn btn-accent" onclick="document.getElementById('lessonModal').style.display='flex'">+ Создать первый урок</button>
                    </div>
                </div>`;
            return;
        }

        const now = new Date();
        container.innerHTML = lessons.map(l => {
            const dt = l.scheduled_at ? new Date(l.scheduled_at) : null;
            const isPast = dt && dt < now;
            const isToday = dt && dt.toDateString() === now.toDateString();
            const statusColor = l.is_completed ? 'var(--success)' : isToday ? 'var(--warning)' : isPast ? 'var(--muted)' : 'var(--info)';
            const statusLabel = l.is_completed ? '✅ Завершён' : isToday ? '🔴 Сегодня' : isPast ? '⌛ Прошёл' : '📅 Предстоит';

            return `
                <div class="panel" style="transition:transform 0.2s;" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform=''">
                    <div class="panel-body" style="display:flex;align-items:center;gap:20px;padding:20px 24px;">
                        <div style="width:60px;height:60px;border-radius:16px;background:rgba(4,30,66,0.05);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">
                            <span style="font-size:11px;color:var(--muted);font-weight:600;">${dt ? dt.toLocaleString('ru-RU',{month:'short'}).toUpperCase() : '—'}</span>
                            <span style="font-size:24px;font-weight:800;color:var(--primary);line-height:1;">${dt ? dt.getDate() : '—'}</span>
                        </div>
                        <div style="flex:1;min-width:0;">
                            <div style="font-size:16px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${l.topic}</div>
                            <div style="font-size:13px;color:var(--muted);">${dt ? dt.toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',weekday:'long'}) : '—'}</div>
                            ${l.description ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;">${l.description}</div>` : ''}
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;">
                            <span style="font-size:12px;font-weight:600;color:${statusColor};">${statusLabel}</span>
                            ${l.zoom_link ? `<a href="${l.zoom_link}" target="_blank" class="btn btn-outline btn-sm">🔗 Zoom</a>` : ''}
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    // Load groups into both select elements
    async function loadGroups() {
        try {
            const userId = localStorage.getItem('user_id');
            // Admin sees all groups; teacher sees only theirs via new endpoint
            const url = role === 'admin'
                ? `${API}/api/groups`
                : `${API}/api/teacher/groups/${userId}`;
            const res = await fetch(url, { headers: authHeaders() });
            if (!res.ok) {
                // Fallback to all groups
                const fallback = await fetch(`${API}/api/groups`, { headers: authHeaders() });
                if (!fallback.ok) return;
                allGroups = await fallback.json();
            } else {
                allGroups = await res.json();
            }

            const mainSel = document.getElementById('groupSelect');
            const modalSel = document.getElementById('lGroupId');

            allGroups.forEach(g => {
                const label = `${g.name} (${g.course?.title || 'Курс #' + g.course_id})`;
                const o1 = new Option(label, g.id);
                const o2 = new Option(label, g.id);
                mainSel.appendChild(o1);
                modalSel.appendChild(o2);
            });

            // Auto-select first group if only one
            if (allGroups.length === 1) {
                mainSel.value = allGroups[0].id;
                mainSel.dispatchEvent(new Event('change'));
            }
        } catch(e) { console.error(e); }
    }

    document.getElementById('groupSelect').addEventListener('change', async (e) => {
        const groupId = e.target.value;
        if (!groupId) return;

        const group = allGroups.find(g => g.id == groupId);
        const groupName = group ? group.name : `Группа #${groupId}`;

        showLoading('lessonsContainer', 'Загрузка уроков...');

        try {
            const res = await fetch(`${API}/api/groups/${groupId}/lessons`, { headers: authHeaders() });
            if (!res.ok) throw new Error();
            const lessons = await res.json();
            // Sort by date ascending
            lessons.sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
            renderLessons(lessons, groupName);
        } catch(e) {
            showError('lessonsContainer', 'Ошибка', 'Не удалось загрузить уроки');
        }
    });

    // Modal
    document.getElementById('addLessonBtn').onclick = () => {
        // Sync group selection from main select to modal
        const selectedGroup = document.getElementById('groupSelect').value;
        if (selectedGroup) document.getElementById('lGroupId').value = selectedGroup;
        document.getElementById('lessonModal').style.display = 'flex';
    };
    function closeModal() {
        document.getElementById('lessonModal').style.display = 'none';
        document.getElementById('lessonForm').reset();
        document.getElementById('lError').style.display = 'none';
    }

    document.getElementById('lessonForm').onsubmit = async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('lError');
        errEl.style.display = 'none';
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Создание...';

        const groupId = parseInt(document.getElementById('lGroupId').value);
        const dateVal = document.getElementById('lDateTime').value;

        try {
            const res = await fetch(`${API}/api/lessons`, {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({
                    group_id: groupId,
                    topic: document.getElementById('lTopic').value,
                    description: document.getElementById('lDesc').value || null,
                    scheduled_at: dateVal,
                    zoom_link: document.getElementById('lZoom').value || null
                })
            });
            if (res.ok) {
                closeModal();
                showToast('Урок создан', 'success');
                // Reload lessons for the current group
                document.getElementById('groupSelect').value = groupId;
                document.getElementById('groupSelect').dispatchEvent(new Event('change'));
            } else {
                const d = await res.json();
                errEl.textContent = d.detail || 'Ошибка создания урока';
                errEl.style.display = 'block';
            }
        } catch(e) {
            errEl.textContent = 'Ошибка соединения';
            errEl.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Создать урок';
        }
    };

    loadGroups();
</script>

<div class="sidebar-overlay" ></div>
</body>
</html>
