<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал группы | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
    <style>
        .gb-controls { display:flex; gap:12px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
        .gb-controls select { padding:10px 16px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; background:var(--surface); color:var(--text); cursor:pointer; }
        .gb-wrap { overflow-x:auto; background:var(--surface); border-radius:16px; border:1px solid var(--border); }
        .gb-table { width:100%; border-collapse:collapse; min-width:600px; }
        .gb-table th { position:sticky; top:0; background:var(--bg-color); padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
        .gb-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; text-align:center; }
        .gb-table tr:hover td { background:rgba(4,30,66,0.02); }
        .gb-name { text-align:left; font-weight:600; white-space:nowrap; }
        .gb-grade { display:inline-block; min-width:28px; padding:2px 6px; border-radius:6px; font-weight:600; font-size:12px; }
        .gb-grade.high { background:#dcfce7; color:#166534; }
        .gb-grade.mid { background:#fef9c3; color:#854d0e; }
        .gb-grade.low { background:#fee2e2; color:#991b1b; }
        .gb-grade.na { background:var(--bg-color); color:var(--muted); }
        .gb-att-yes { color:#16a34a; font-weight:700; }
        .gb-att-no { color:#dc2626; font-weight:700; }
        .gb-section { padding:12px 16px; font-weight:700; font-size:13px; background:var(--bg-color); border-bottom:1px solid var(--border); }
        .gb-empty { text-align:center; padding:60px; color:var(--muted); }
        .gb-summary { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
        .gb-stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
        .gb-stat-value { font-size:24px; font-weight:700; }
        .gb-stat-label { font-size:11px; color:var(--muted); margin-top:4px; }
    </style>
</head>
<body>
<aside id="main-sidebar" class="sidebar">
    <div class="sidebar-logo"><img src="../logo.png" alt="Logo" style="height:32px;"> TIL <span>USER</span><small>TEACHER</small></div>
    <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span> Мой кабинет</a>
        <a href="students.html"><span class="icon">👨‍🎓</span> Мои студенты</a>
        <a href="groups.html"><span class="icon">👥</span> Группы</a>
        <a href="gradebook.html" class="active"><span class="icon">📋</span> Журнал</a>
        <a href="homeworks.html"><span class="icon">📝</span> Проверка ДЗ</a>
        <a href="lessons.html"><span class="icon">🗓️</span> Уроки</a>
        <a href="attendance.html"><span class="icon">📋</span> Посещаемость</a>
        <a href="../chat.html"><span class="icon">💬</span> Чат<span class="chat-badge"></span></a>
    </nav>
    <div class="sidebar-bottom">
    <button class="notif-bell" onclick="toggleNotifDropdown()" title="Уведомления">🔔 <span class="badge-dot"></span></button>
    <div class="notif-dropdown" id="notifDropdown"></div>



    <a href="../index.html"><span class="icon">🌐</span> На сайт</a>
    <a href="../settings.html"><span class="icon">⚙️</span> Настройки</a>
    <a href="../login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
</div>
</aside>



<div class="page-content"><div class="gb-controls">
            <select id="groupSelect" onchange="loadGradebook(this.value)">
                <option value="">— Выберите группу —</option>
            </select>
            <span id="gbInfo" style="color:var(--muted);font-size:13px;"></span>
        </div>

        <div id="gbSummary" class="gb-summary"></div>

        <div id="gbContent">
            <div class="gb-empty">
                <div style="font-size:48px;margin-bottom:12px;">📋</div>
                <h3>Выберите группу</h3>
                <p style="color:var(--muted);">Чтобы увидеть журнал, выберите группу сверху</p>
            </div>
        </div>
    </div>
</div>

<script src="../auth-utils.js"></script>
<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    const myRole = localStorage.getItem('user_role');
    if (!token || (myRole !== 'teacher' && myRole !== 'admin')) window.location.href = '../login.html';
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../login.html'; };

    let allGroups = [];
    const myId = parseInt(localStorage.getItem('user_id'));

    async function loadGroups() {
        try {
            const r = await fetch(`${API}/api/teacher/groups/${myId}`, { headers: { Authorization: `Bearer ${token}` } });
            if (!r.ok) return;
            const groups = await r.json();
            allGroups = groups;
            const sel = document.getElementById('groupSelect');
            sel.innerHTML = '<option value="">— Выберите группу —</option>' + groups.map(g =>
                `<option value="${g.id}">${g.name} — ${g.course || ''}</option>`
            ).join('');
        } catch {}
    }

    async function loadGradebook(groupId) {
        const el = document.getElementById('gbContent');
        const sum = document.getElementById('gbSummary');
        const info = document.getElementById('gbInfo');
        if (!groupId) {
            el.innerHTML = '<div class="gb-empty"><div style="font-size:48px;margin-bottom:12px;">📋</div><h3>Выберите группу</h3></div>';
            sum.innerHTML = '';
            info.textContent = '';
            return;
        }

        const grp = allGroups.find(g => g.id == groupId);
        info.textContent = grp ? `${grp.course || ''}` : '';

        el.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';
        sum.innerHTML = '';

        try {
            const r = await fetch(`${API}/api/groups/${groupId}/gradebook`, { headers: { Authorization: `Bearer ${token}` } });
            if (!r.ok) { el.innerHTML = '<div class="gb-empty">⚠️ Ошибка загрузки</div>'; return; }
            const data = await r.json();

            // Summary stats
            if (data.students && data.homeworks) {
                const total = data.students.length;
                const hwCount = data.homeworks.length;
                const lessonCount = data.lessons.length;
                let graded = 0;
                Object.values(data.submissions || {}).forEach(hw => { Object.values(hw).forEach(s => { if (s.grade && s.grade !== 'returned') graded++; }); });
                sum.innerHTML = `
                    <div class="gb-stat"><div class="gb-stat-value">${total}</div><div class="gb-stat-label">Студентов</div></div>
                    <div class="gb-stat"><div class="gb-stat-value">${hwCount}</div><div class="gb-stat-label">ДЗ</div></div>
                    <div class="gb-stat"><div class="gb-stat-value">${lessonCount}</div><div class="gb-stat-label">Уроков</div></div>
                    <div class="gb-stat"><div class="gb-stat-value">${graded}</div><div class="gb-stat-label">Оценок</div></div>
                `;
            }

            if (!data.students || !data.students.length) {
                el.innerHTML = '<div class="gb-empty">👥 В группе нет студентов</div>';
                return;
            }

            const hasHw = data.homeworks && data.homeworks.length > 0;
            const hasLessons = data.lessons && data.lessons.length > 0;

            if (!hasHw && !hasLessons) {
                el.innerHTML = '<div class="gb-empty">📭 Нет уроков и домашних заданий</div>';
                return;
            }

            let html = '<div class="gb-wrap"><table class="gb-table"><thead><tr><th style="text-align:left;min-width:160px;">Студент</th>';
            if (hasHw) data.homeworks.forEach(h => { html += `<th title="${esc(h.title)}">📝<br>${h.title.substring(0,12)}</th>`; });
            if (hasLessons) data.lessons.forEach(l => { html += `<th title="${esc(l.topic)}">📅<br>${l.date || ''}</th>`; });
            html += '</tr></thead><tbody>';

            data.students.forEach(s => {
                html += `<tr><td class="gb-name">${esc(s.name)}</td>`;
                if (hasHw) data.homeworks.forEach(h => {
                    const sub = (data.submissions[h.id] || {})[s.id];
                    let gradeHtml = '<span class="gb-grade na">—</span>';
                    if (sub) {
                        const g = parseInt(sub.grade);
                        const cls = g >= 8 ? 'high' : g >= 5 ? 'mid' : 'low';
                        if (sub.grade === 'returned') gradeHtml = '<span class="gb-grade na" title="Возвращено">↩</span>';
                        else gradeHtml = `<span class="gb-grade ${cls}" title="${esc(sub.feedback || '')}">${esc(sub.grade)}</span>`;
                    }
                    html += `<td>${gradeHtml}</td>`;
                });
                if (hasLessons) data.lessons.forEach(l => {
                    const att = (data.attendance[l.id] || {})[s.id];
                    html += `<td>${att === true ? '✅' : att === false ? '❌' : '—'}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            el.innerHTML = html;

        } catch(e) {
            el.innerHTML = '<div class="gb-empty">⚠️ Ошибка загрузки</div>';
        }
    }

    loadGroups();
    // Check for group in URL
    const params = new URLSearchParams(window.location.search);
    const gid = params.get('group_id');
    if (gid) { setTimeout(() => { document.getElementById('groupSelect').value = gid; loadGradebook(gid); }, 500); }
</script>
<div class="sidebar-overlay" ></div>
</body>
</html>
