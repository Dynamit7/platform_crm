<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка ДЗ | TIL USER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-logo"><img src="../logo.png" alt="Logo" style="height:32px;"> TIL <span>USER</span><small>TEACHER</small></div>
    <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span> Мой кабинет</a>
        <a href="students.html"><span class="icon">👨‍🎓</span> Мои студенты</a>
        <a href="homeworks.html" class="active"><span class="icon">📝</span> Проверка ДЗ</a>
        <a href="lessons.html"><span class="icon">🗓️</span> Уроки</a>
    </nav>
    <div class="sidebar-bottom">
        <a href="../index.html"><span class="icon">🌐</span> На сайт</a>
        <a href="../login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
    </div>
</aside>

<div class="main-content">
    <div class="top-bar">
        <h1>📝 Проверка домашних заданий</h1>
        <div class="top-bar-right">
            <div class="admin-badge" style="background:linear-gradient(135deg,#3B82F6,#6366F1);">👩‍🏫 TEACHER</div>
        </div>
    </div>

    <div class="page-content">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
            <!-- Pending list -->
            <div class="panel">
                <div class="panel-header">
                    <h2>⏳ Ожидают проверки (<span id="pendingCount">0</span>)</h2>
                </div>
                <div id="pendingList">
                    <div style="text-align:center;color:var(--muted);padding:30px;">Загрузка...</div>
                </div>
            </div>

            <!-- Grade form -->
            <div class="panel" id="gradePanel">
                <div class="panel-header"><h2>✏️ Оценить работу</h2></div>
                <div class="panel-body" id="gradeContent">
                    <div style="text-align:center;color:var(--muted);padding:30px;">
                        <div style="font-size:40px;margin-bottom:12px;">👈</div>
                        <p>Выберите работу из списка слева</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    const role = localStorage.getItem('user_role');
    if (!token || (role !== 'teacher' && role !== 'admin')) window.location.href = '../login.html';
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../login.html'; };
    function authHeaders() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

    let pendingList = [];
    let selectedId = null;

    function renderList(subs) {
        document.getElementById('pendingCount').textContent = subs.length;
        const el = document.getElementById('pendingList');
        if (!subs.length) {
            el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;">🎉 Все работы проверены!</div>';
            return;
        }
        el.innerHTML = subs.map(s => `
            <div onclick="selectSubmission(${s.id})" style="padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:0.2s;" 
                 class="sub-item" id="sub-${s.id}">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="min-width:0;">
                        <strong style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(s.hw_title || 'ДЗ #' + s.homework_id)}</strong>
                        <div style="font-size:12px;color:var(--primary);font-weight:600;">${esc(s.student_name || 'ID ' + s.student_id)}</div>
                        <div style="font-size:12px;color:var(--muted);">${s.submitted_at ? new Date(s.submitted_at).toLocaleString('ru-RU') : '—'}</div>
                    </div>
                    <span class="badge-status contacted">На проверке</span>
                </div>
            </div>
        `).join('');
        
        // Auto-select if ID in URL
        const urlParams = new URLSearchParams(window.location.search);
        const subId = urlParams.get('id');
        if (subId && subs.some(x => x.id == subId)) {
            selectSubmission(parseInt(subId));
            // Remove from URL to avoid re-selecting after refresh/next action
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    }

    function selectSubmission(id) {
        selectedId = id;
        const sub = pendingList.find(s => s.id === id);
        if (!sub) return;

        document.querySelectorAll('.sub-item').forEach(el => el.style.background = '');
        const selected = document.getElementById(`sub-${id}`);
        if (selected) selected.style.background = 'rgba(4,30,66,0.04)';

        document.getElementById('gradeContent').innerHTML = `
            <div style="margin-bottom:20px;padding:16px;background:var(--bg);border-radius:12px;border:1px solid var(--border);">
                <h3 style="font-size:14px;margin-bottom:10px;color:var(--muted);">Ответ студента:</h3>
                <p style="font-size:14px;line-height:1.6;">${sub.content || '(пусто)'}</p>
            </div>
            <form id="gradeForm">
                <div style="margin-bottom:16px;">
                    <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Оценка</label>
                    <input type="text" id="gradeInput" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="95/100 или 8.5/9.0" required>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Комментарий преподавателя</label>
                    <textarea id="feedbackInput" style="width:100%;height:100px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;resize:vertical;" placeholder="Отличная работа! Обрати внимание на..."></textarea>
                </div>
                <div style="display:flex;gap:10px;">
                    <button type="submit" class="btn btn-success" style="flex:1;">✅ Принять и оценить</button>
                    <button type="button" class="btn btn-danger" onclick="returnWork()">↩ Вернуть</button>
                </div>
            </form>
        `;
        document.getElementById('gradeForm').onsubmit = submitGrade;
    }

    async function submitGrade(e) {
        e.preventDefault();
        const grade = document.getElementById('gradeInput').value;
        const feedback = document.getElementById('feedbackInput').value;
        try {
            const res = await fetch(`${API}/api/homework/grade`, {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({ submission_id: selectedId, grade, feedback })
            });
            if (res.ok) {
                pendingList = pendingList.filter(s => s.id !== selectedId);
                renderList(pendingList);
                document.getElementById('gradeContent').innerHTML = '<div style="text-align:center;color:var(--success);padding:30px;"><div style="font-size:40px;margin-bottom:12px;">✅</div><p>Работа проверена!</p></div>';
            } else { alert('Ошибка при сохранении оценки'); }
        } catch(e) { alert('Ошибка соединения'); }
    }

    async function returnWork() {
        if (!selectedId) return;
        try {
            await fetch(`${API}/api/homework/grade`, {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({ submission_id: selectedId, grade: 'returned', feedback: document.getElementById('feedbackInput')?.value || 'Требует доработки' })
            });
            pendingList = pendingList.filter(s => s.id !== selectedId);
            renderList(pendingList);
            document.getElementById('gradeContent').innerHTML = '<div style="text-align:center;color:var(--warning);padding:30px;"><div style="font-size:40px;margin-bottom:12px;">↩</div><p>Работа возвращена студенту</p></div>';
        } catch(e) { alert('Ошибка'); }
    }

    async function load() {
        try {
            const res = await fetch(`${API}/api/homework/pending`, { headers: authHeaders() });
            if (!res.ok) return;
            pendingList = await res.json();
            renderList(pendingList);
        } catch(e) { console.error(e); }
    }
    load();
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
<script src="../auth-utils.js"></script>
</body>
</html>
