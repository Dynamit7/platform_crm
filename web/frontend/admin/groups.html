<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Группы | TIL USER Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-logo"><img src="../logo.png" alt="Logo" style="height:32px;"> TIL <span>USER</span><small>ADMIN CRM</small></div>
        <nav class="sidebar-nav">
        <div class="section-label">Главное</div>
        <a href="dashboard.html" ><span class="icon">📊</span> Дашборд</a>
        <a href="leads.html" ><span class="icon">🎯</span> Заявки (Kanban)</a>

        <div class="section-label">Управление</div>
        <a href="students.html" ><span class="icon">👨‍🎓</span> Студенты</a>
        <a href="teachers.html" ><span class="icon">👩‍🏫</span> Преподаватели</a>
        <a href="groups.html" class="active"><span class="icon">👥</span> Группы</a>
        <a href="courses.html" ><span class="icon">📚</span> Курсы</a>

        <div class="section-label">Финансы</div>
        <a href="payments.html" ><span class="icon">💳</span> Платежи</a>
        <a href="reports.html" ><span class="icon">📈</span> Отчёты</a>

        <div class="section-label">Коммуникация</div>
        <a href="../chat.html"><span class="icon">💬</span> Чат</a>
        <a href="broadcast.html" ><span class="icon">📢</span> Рассылка</a>
        <a href="pending-users.html" ><span class="icon">⏳</span> Новые заявки <span id="pendingBadge" class="chat-badge" style="display:none;"></span></a>
        <a href="reviews.html" ><span class="icon">⭐</span> Отзывы</a>
    </nav>
    <div class="sidebar-bottom">
        <a href="../index.html"><span class="icon">🌐</span> На сайт</a>
        <a href="../login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
    </div>
</aside>

<div class="main-content">
    <div class="top-bar">
        <h1>👥 Группы</h1>
        <div class="top-bar-right">
            <button class="btn btn-accent" id="addGroupBtn">+ Создать группу</button>
            <div class="admin-badge">👑 ADMIN</div>
        </div>
    </div>

    <div class="page-content">
        <!-- Filters -->
        <div class="filters-bar" style="margin-bottom:20px;">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию...">
            <select class="filter-select" id="statusFilter">
                <option value="">Все статусы</option>
                <option value="active">Активные</option>
                <option value="inactive">Закрытые</option>
            </select>
        </div>

        <div id="groupsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
            <div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1;">Загрузка групп...</div>
        </div>
    </div>
</div>

<!-- Add Group Modal -->
<div id="groupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); z-index:999; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:24px; padding:36px; width:90%; max-width:500px; box-shadow:0 25px 60px rgba(0,0,0,0.15); max-height:90vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <h2>👥 Новая группа</h2>
            <button onclick="closeModal()" style="font-size:24px;background:none;border:none;cursor:pointer;color:#666;">×</button>
        </div>
        <form id="groupForm">
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Название группы</label>
                <input type="text" id="gName" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="Японский N4 — Группа А" required>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Курс</label>
                <select id="gCourseId" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" required>
                    <option value="">— Выберите курс —</option>
                </select>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Преподаватель</label>
                <select id="gTeacherId" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;">
                    <option value="">— Не назначен —</option>
                </select>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Макс. студентов</label>
                <input type="number" id="gMaxStudents" value="8" min="1" max="50" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;">
            </div>
            <div id="gError" style="display:none;color:var(--danger);font-size:13px;margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Создать группу</button>
        </form>
    </div>
</div>

<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '../login.html';
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../login.html'; };
    function authHeaders() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

    let allGroups = [];

    function renderGroups(groups) {
        const grid = document.getElementById('groupsGrid');
        if (!groups.length) {
            grid.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1;">Групп пока нет. Создайте первую!</div>';
            return;
        }
        grid.innerHTML = groups.map(g => `
            <div class="panel" style="transition:transform 0.2s;" onmouseenter="this.style.transform='translateY(-3px)'" onmouseleave="this.style.transform=''">
                <div class="panel-header">
                    <h2 style="font-size:16px;">👥 ${g.name}</h2>
                    <span class="badge-status ${g.is_active ? 'enrolled' : 'lost'}">${g.is_active ? 'Активна' : 'Закрыта'}</span>
                </div>
                <div class="panel-body" style="display:flex;flex-direction:column;gap:10px;">
                    <div style="display:flex;align-items:center;gap:8px;font-size:14px;">
                        <span>📚</span>
                        <span style="color:var(--muted);">Курс:</span>
                        <strong>${g.course?.title || `Курс #${g.course_id}`}</strong>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;font-size:14px;">
                        <span>👩‍🏫</span>
                        <span style="color:var(--muted);">Преподаватель:</span>
                        <strong>${g.teacher?.name || 'Не назначен'}</strong>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;font-size:14px;">
                        <span>👤</span>
                        <span style="color:var(--muted);">Макс. студентов:</span>
                        <strong>${g.max_students}</strong>
                    </div>
                    <div style="font-size:12px;color:var(--muted);padding-top:8px;border-top:1px solid var(--border);">
                        Создана: ${g.created_at ? new Date(g.created_at).toLocaleDateString('ru-RU') : '—'}
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Filters
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);
    function applyFilters() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const s = document.getElementById('statusFilter').value;
        let filtered = allGroups.filter(g => g.name.toLowerCase().includes(q));
        if (s === 'active') filtered = filtered.filter(g => g.is_active);
        if (s === 'inactive') filtered = filtered.filter(g => !g.is_active);
        renderGroups(filtered);
    }

    // Modal
    document.getElementById('addGroupBtn').onclick = () => { document.getElementById('groupModal').style.display = 'flex'; };
    function closeModal() { document.getElementById('groupModal').style.display = 'none'; document.getElementById('groupForm').reset(); }

    document.getElementById('groupForm').onsubmit = async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('gError');
        errEl.style.display = 'none';
        const teacherVal = document.getElementById('gTeacherId').value;
        try {
            const res = await fetch(`${API}/api/groups`, {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({
                    name: document.getElementById('gName').value,
                    course_id: parseInt(document.getElementById('gCourseId').value),
                    teacher_id: teacherVal ? parseInt(teacherVal) : null,
                    max_students: parseInt(document.getElementById('gMaxStudents').value) || 8
                })
            });
            if (res.ok) { closeModal(); loadGroups(); }
            else { const d = await res.json(); errEl.textContent = d.detail || 'Ошибка'; errEl.style.display = 'block'; }
        } catch(e) { errEl.textContent = 'Ошибка соединения'; errEl.style.display = 'block'; }
    };

    // Populate selects
    async function populateSelects() {
        try {
            const [coursesRes, teachersRes] = await Promise.all([
                fetch(`${API}/api/courses`, { headers: authHeaders() }),
                fetch(`${API}/api/teachers`, { headers: authHeaders() })
            ]);
            if (coursesRes.ok) {
                const courses = await coursesRes.json();
                const sel = document.getElementById('gCourseId');
                courses.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.title; sel.appendChild(o); });
            }
            if (teachersRes.ok) {
                const teachers = await teachersRes.json();
                const sel = document.getElementById('gTeacherId');
                teachers.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
            }
        } catch(e) { console.error(e); }
    }

    async function loadGroups() {
        try {
            const res = await fetch(`${API}/api/groups`, { headers: authHeaders() });
            if (!res.ok) return;
            allGroups = await res.json();
            renderGroups(allGroups);
        } catch(e) { console.error(e); }
    }

    populateSelects();
    loadGroups();
</script>
<script src="../auth-utils.js"></script>
</body>
</html>
