<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Преподаватели | TIL USER Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-logo"><img src="../logo.png" alt="Logo" style="height:32px;"> TIL <span>USER</span><small>ADMIN CRM</small></div>
    <nav class="sidebar-nav">
        <div class="section-label">Главное</div>
        <a href="dashboard.html"><span class="icon">📊</span> Дашборд</a>
        <a href="leads.html"><span class="icon">🎯</span> Заявки (Kanban)</a>
        <div class="section-label">Управление</div>
        <a href="students.html"><span class="icon">👨‍🎓</span> Студенты</a>
        <a href="teachers.html" class="active"><span class="icon">👩‍🏫</span> Преподаватели</a>
        <a href="groups.html"><span class="icon">👥</span> Группы</a>
        <a href="courses.html"><span class="icon">📚</span> Курсы</a>
        <div class="section-label">Финансы</div>
        <a href="payments.html"><span class="icon">💳</span> Платежи</a>
        <a href="reports.html"><span class="icon">📈</span> Отчёты</a>
    </nav>
    <div class="sidebar-bottom">
        <a href="../index.html"><span class="icon">🌐</span> На сайт</a>
        <a href="../login.html" class="logout" id="logoutBtn"><span class="icon">🚪</span> Выйти</a>
    </div>
</aside>

<div class="main-content">
    <div class="top-bar">
        <h1>👩‍🏫 Преподаватели</h1>
        <div class="top-bar-right">
            <button class="btn btn-accent" id="addTeacherBtn">+ Добавить преподавателя</button>
            <div class="admin-badge">👑 ADMIN</div>
        </div>
    </div>
    <div class="page-content">
        <!-- Stats row -->
        <div class="kpi-grid" style="grid-template-columns: repeat(3,1fr); margin-bottom: 24px;">
            <div class="kpi-card">
                <div class="kpi-icon blue">👩‍🏫</div>
                <div class="kpi-info">
                    <h3>Всего преподавателей</h3>
                    <div class="kpi-value" id="countTotal">—</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon green">👤</div>
                <div class="kpi-info">
                    <h3>Аккаунтов (роль teacher)</h3>
                    <div class="kpi-value" id="countAccounts">—</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon yellow">📚</div>
                <div class="kpi-info">
                    <h3>Предметов</h3>
                    <div class="kpi-value" id="countSubjects">—</div>
                </div>
            </div>
        </div>

        <div id="teachersGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;">
            <div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1;">Загрузка...</div>
        </div>
    </div>
</div>

<!-- Add Teacher Modal -->
<div id="teacherModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); z-index:999; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:24px; padding:36px; width:90%; max-width:520px; box-shadow:0 25px 60px rgba(0,0,0,0.15); max-height:90vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <h2>👩‍🏫 Новый преподаватель</h2>
            <button onclick="closeModal()" style="font-size:24px;background:none;border:none;cursor:pointer;color:#666;">×</button>
        </div>
        <form id="teacherForm">
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">ФИО преподавателя</label>
                <input type="text" id="tName" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="Анна Викторова" required>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Предметы / специализация</label>
                <input type="text" id="tSubjects" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="Японский язык, JLPT N4" required>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Краткая биография</label>
                <textarea id="tBio" style="width:100%;height:90px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;resize:vertical;" placeholder="Опыт преподавания 5+ лет, сертификат JLPT N2..."></textarea>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Фото (URL, необязательно)</label>
                <input type="text" id="tPhoto" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;" placeholder="https://...">
            </div>
            <div id="tError" style="display:none;color:var(--danger);font-size:13px;margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">Добавить преподавателя</button>
        </form>
    </div>
</div>

<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '../login.html';
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '../login.html'; };
    function authHeaders() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

    let allTeachers = [];

    function renderGrid(teachers) {
        const grid = document.getElementById('teachersGrid');
        document.getElementById('countTotal').textContent = teachers.length;

        // Unique subjects
        const subjects = new Set();
        teachers.forEach(t => t.subjects?.split(',').forEach(s => subjects.add(s.trim())));
        document.getElementById('countSubjects').textContent = subjects.size;

        if (!teachers.length) {
            grid.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1;">Преподавателей пока нет. Добавьте первого!</div>';
            return;
        }
        grid.innerHTML = teachers.map(t => {
            const initial = (t.name || '?')[0].toUpperCase();
            const colors = ['#041E42','#6366F1','#10B981','#F59E0B','#EF4444','#8B5CF6'];
            const color = colors[t.id % colors.length];
            return `
                <div class="panel" style="transition:transform 0.2s,box-shadow 0.2s;" onmouseenter="this.style.transform='translateY(-4px)';this.style.boxShadow='0 20px 40px rgba(0,0,0,0.1)'" onmouseleave="this.style.transform='';this.style.boxShadow=''">
                    <div class="panel-body" style="text-align:center; padding: 28px 20px;">
                        <div style="width:80px;height:80px;border-radius:50%;background:${t.photo_url ? `url(${t.photo_url}) center/cover` : `linear-gradient(135deg,${color},${color}aa)`};
                            display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:white;margin:0 auto 16px;border:3px solid rgba(255,255,255,0.6);box-shadow:0 8px 24px rgba(0,0,0,0.12);">
                            ${t.photo_url ? '' : initial}
                        </div>
                        <h3 style="font-size:18px;margin-bottom:8px;font-family:'Outfit',sans-serif;">${t.name}</h3>
                        <div style="margin-bottom:12px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">
                            ${(t.subjects || '').split(',').map(s => `<span class="badge-status enrolled" style="font-size:11px;">${s.trim()}</span>`).join('')}
                        </div>
                        <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px;">${t.bio || '—'}</p>
                        <div style="border-top:1px solid var(--border);padding-top:14px;display:flex;gap:8px;justify-content:center;">
                            <span style="font-size:12px;color:var(--muted);">ID: ${t.id}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    document.getElementById('addTeacherBtn').onclick = () => { document.getElementById('teacherModal').style.display = 'flex'; };
    function closeModal() { document.getElementById('teacherModal').style.display = 'none'; document.getElementById('teacherForm').reset(); }

    document.getElementById('teacherForm').onsubmit = async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('tError');
        errEl.style.display = 'none';
        try {
            const res = await fetch(`${API}/api/teachers`, {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({
                    name: document.getElementById('tName').value,
                    subjects: document.getElementById('tSubjects').value,
                    bio: document.getElementById('tBio').value || '',
                    photo_url: document.getElementById('tPhoto').value || null,
                })
            });
            if (res.ok) { closeModal(); loadTeachers(); }
            else { const d = await res.json(); errEl.textContent = d.detail || 'Ошибка'; errEl.style.display = 'block'; }
        } catch(e) { errEl.textContent = 'Ошибка соединения'; errEl.style.display = 'block'; }
    };

    async function loadTeachers() {
        try {
            const [teachersRes, accountsRes] = await Promise.all([
                fetch(`${API}/api/teachers`, { headers: authHeaders() }),
                fetch(`${API}/api/admin/teachers`, { headers: authHeaders() })
            ]);
            if (teachersRes.ok) {
                allTeachers = await teachersRes.json();
                renderGrid(allTeachers);
            }
            if (accountsRes.ok) {
                const accounts = await accountsRes.json();
                document.getElementById('countAccounts').textContent = accounts.length;
            }
        } catch(e) { console.error(e); }
    }
    loadTeachers();
</script>
<script src="../auth-utils.js"></script>
</body>
</html>
